[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — serves index.html for all routes not matching a static file.
# The _redirects file in public/ handles more specific rules (docs, route, etc.).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
